<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <!-- CSS Style -->
    <link rel="stylesheet" href="./style.css" />

    <!-- Google Font -->
    <link
      rel="stylesheet"
      href="  https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap"
    />

    <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png" />

    <title>Frontend Mentor | Fylo data storage component</title>
  </head>
  <body>
    <main class="card">
      <section class="fylo-container">
        <section class="container">
          <!-- ////////////////////////// -->
          <!-- right box -->
          <article class="fylo-section">
            <img src="./images/logo.svg" alt="fylo logo" />

            <!-- Icon Section -->
            <section class="fylo-content">
              <div class="fylo-icon">
                <img src="./images/icon-document.svg" alt="" />
              </div>
              <div class="fylo-icon">
                <img src="./images/icon-folder.svg" alt="" />
              </div>
              <div class="fylo-icon"><img src="./images/icon-upload.svg" alt="" / ></div>
            </section>
            <!-- ////////////////////////////////// -->
          </article>
          <!-- /////////////////////////////////// -->
          <!-- left box -->
          <article class="fylo-left-section">
            <p class="fylo-left-statment">You’ve used <span>815 GB</span> of your storage</p>
            <div class="fylo-progress-bar-container">
              <div class="fylo-progress-bar"></div>
              <div class="fylo-progress"></div>
              <div class="fylo-progress-bar-text">
                <p>0 GB</p>
                <p>1000 GB</p>
              </div>
            </div>
            <div class="notification">
              <p><span>185</span> GB LEFT</p>
              <div class="tail"></div>
            </div>
          </article>
        </section>
      </section>
    </main>
  </body>
</html>
